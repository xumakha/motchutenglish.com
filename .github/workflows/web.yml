name: Next.js app
on:
  push:
    paths: ["web/**", "application/controllers/Product.php", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "application/controllers/Product.php", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-isolated-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: mysql://root:ci-isolated-only@127.0.0.1:3306/mce_ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      MAIL_DRIVER: log
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install MariaDB client (backup and restore drill tests)
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests (includes PHP route contract coverage)
        run: pnpm test
      - name: Create database and apply migrations
        run: pnpm db:reset
      - name: Database tests
        run: pnpm test:db
      - name: Admin CLI health check
        run: pnpm admin check
      - name: Seed sample catalog (validates every sample lesson)
        run: |
          pnpm admin create ci-admin@example.test "CI" --local
          pnpm seed --publish-reviewed-samples
      - name: Build
        run: pnpm build
      - name: Build and smoke-test the bundled worker
        run: |
          pnpm build:worker
          node dist/worker.mjs tick
          node dist/worker.mjs run 50
          node dist/worker.mjs cleanup
          node dist/worker.mjs reconcile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
