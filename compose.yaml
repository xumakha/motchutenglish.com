# Production stack: MariaDB, a one-off migration, the web server and the worker.
# Put a TLS reverse proxy (Caddy, nginx, …) in front of 127.0.0.1:3000; it must append the
# client address to X-Forwarded-For (rate limits trust the rightmost entry).
#   docker compose up -d --build        see docs/operations.md

x-app: &app
  build:
    context: .
    args:
      APP_URL: ${APP_URL:?Set an HTTPS APP_URL}
  image: motchutenglish:latest
  environment: &app-env
    APP_URL: ${APP_URL:?Set an HTTPS APP_URL}
    DATABASE_URL: mysql://mce:${MCE_DB_PASSWORD:?Set MCE_DB_PASSWORD}@db:3306/motchutenglish
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (32+ characters)}
    MAIL_DRIVER: ${MAIL_DRIVER:-disabled}
    MAIL_FROM: ${MAIL_FROM:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
    GA4_API_SECRET: ${GA4_API_SECRET:-}
  volumes:
    - writable:/app/writable

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: motchutenglish
      MARIADB_USER: mce
      MARIADB_PASSWORD: ${MCE_DB_PASSWORD:?Set MCE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MCE_DB_ROOT_PASSWORD:?Set MCE_DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["node", "dist/db.mjs", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["sh", "ops/worker-loop.sh"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database:
  writable:
